<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Vynn</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

        }
        nav {
            display: flex;
            justify-content:
            space-between;
            align-items: center;
            background-color: #1b1f3b;
            padding: 10px 20px;
            color:white;
            font-weight: bold;
        
        }
        ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background-color: #fce3d5;
            padding: 30px 20px 26px;
}
        .hero h1 {
            font-size: 2rem; margin-bottom: 10px;
        }
        .hero p {
            font-size: 1rem; margin-bottom: 10px;
        }
        button {
            background-color: #e86a33;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 999px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }
        button:hover {
            background-color: #cf5a26;
        }
        .Service { padding: 30px 24px; }
        .Service h2 {
            font-size:35px;
            padding-left: 10px;
            margin-bottom:14px;
        }
        .content {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap:12px;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px 10px 24px;
        }
        .card .gambar {
            height:70px;
            margin-bottom:15px;
        }
        .card h3 {
            font-size: 0.85rem; 
            margin: 0 0 14px 11px; 
        }
        .card p { font-size: 0.7rem; 
            color: #4a4f73; 
            margin-left: 11px; 
        }
        .c1 { background: #e86a33; }
        .c2 { background: #1b1f3b; }
        .c3 { background: #6d2e46; }

        footer {
            display:flex;
            justify-content:
            space-between;
            align-items:center;
            background: #1b1f3b;
            color: #fff;
            padding: 18px 26px;
            font-weight:bold;
            margin: 5;
            padding: 5;
        }

        footer li {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.75rem;
            margin-left: 6px;
        }
        .wrap { 
            max-width: 900px; 
            margin: 20px auto; 
            padding: 0 16px; 
        }

    </style>
</head>
<body>
    <nav class="nav">
        <div class="logo">Vynn</div>
        <ul>
            <li>beranda</li>
            <li>produk</li>
            <li>kontak</li>
        </ul>
    </nav>
    <section class="hero">
        <h1>Selamat Datang di Vynn</h1>

        <p>Belajar web jadi mudah</p>
        <button>Mulai</button>
    </section>

    <section class="Service">
        <h2>Service</h2>

        <div class="content">
            <div class="card">
                <div class="gambar c1"></div>
            <h3>Service 1</h3>
            <p>apa kek</p>
            </div>

            <div class="card">
                <div class="gambar c2"></div>
            <h3>Service 2</h3>
            <p>apa kek</p>
            </div>

            <div class="card">
                <div class="gambar c3"></div>
            <h3>Service 3</h3>
            <p>apa kek</p>
            </div>
            </div>
    </section>

    <footer>
        <span>&copy; @2026 by.Vynn</span>
        <ul>
            <li>Instagram</li>
            <li>Email</li>
            <li>Tiktok</li>
        </ul>

    </footer>
</body>
</html>
